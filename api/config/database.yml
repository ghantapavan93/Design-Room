default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: design_room_development

test:
  <<: *default
  database: design_room_test

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
  keepalives_idle: 60
  variables:
    statement_timeout: 0
